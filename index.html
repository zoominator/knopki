<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FB Tools</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
    }

    .card {
      width: 420px;
      padding: 40px;
      text-align: center;

      background: #1e293b;
      border-radius: 18px;

      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .bookmarklet {
      display: inline-block;

      padding: 15px 26px;

      background: #1877f2;
      color: white;

      font-size: 17px;
      font-weight: 700;

      text-decoration: none;

      border-radius: 10px;

      cursor: grab;

      transition: transform .15s, background .15s;
    }

    .bookmarklet:hover {
      background: #166fe5;
      transform: translateY(-2px);
    }

    .bookmarklet:active {
      cursor: grabbing;
    }

    .hint {
      margin-top: 25px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>FB Tools</h1>

    <p>
      Drag the button below to your bookmarks bar.
    </p>

    <a
      class="bookmarklet"
      href="javascript:(()=>{const s=document.querySelector('#languagesHeader input[role=switch]');if(!s){alert('Languages: switch not found');return}if(s.checked||s.getAttribute('aria-checked')==='true'){alert('Languages already enabled');return}s.disabled=false;s.removeAttribute('disabled');s.click()})();"
    >
      Enable Languages
    </a>

    <div class="hint">
      Drag → Bookmarks Bar
    </div>

  </div>

</body>
</html>
